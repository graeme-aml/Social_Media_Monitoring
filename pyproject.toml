[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "social-media-monitoring"
version = "0.1.0"
description = "Social media complaint monitoring agent using Apify"
requires-python = ">=3.11"
dependencies = [
    "apify-client>=1.7.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tenacity>=8.2.3",
    "pydantic>=2.6.0",
    "schedule>=1.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
